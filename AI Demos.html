<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Agent workflow</title>
  <!-- Self-contained: no external scripts, styles, fonts, images, APIs, or telemetry. -->
  <style>
    :root {
      --ink: #07151f;
      --paper: #f3f6f3;
      --line: #ccd8d7;
      --cyan: #08a8bf;
      --body: "Aptos", "Segoe UI", Tahoma, sans-serif;
      --display: "Aptos Display", "Bahnschrift", "Trebuchet MS", sans-serif;
      --mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
      --text-meta: 0.75rem;
      --text-compact: 0.8125rem;
      --text-body: 0.875rem;
      --text-lead: 1rem;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: #fff; background: var(--ink); font: 16px/1.5 var(--body); letter-spacing: 0; }
    :focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    .wrap { width: min(1420px, calc(100% - 56px)); margin-inline: auto; }

    /* ===== Agent workflow — landscape pipeline ===== */
    .workflow { background: var(--ink); color: #fff; padding: 46px 0 54px; }
    .workflow .wrap { position: relative; }
    .wf-head { margin-bottom: 30px; }
    .wf-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 18px;
    color: #58a6ff;
    font: 700 clamp(1.2rem, 2vw, 1.8rem)/1.2 var(--mono);
    letter-spacing: .12em;
    text-transform: uppercase;}
    .wf-eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #58a6ff; box-shadow: 0 0 0 4px rgba(88,166,255,.16); animation: wf-blink 1.6s ease-in-out infinite; }
    @keyframes wf-blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .workflow h2 { color: #fff; margin: 0 0 10px; font: 660 clamp(1.8rem, 2.6vw, 2.8rem)/1 var(--display); max-width: 18ch; }
    .wf-lede { max-width: 780px; margin: 0; color: #9fb2bb; font-size: var(--text-body); }

    #wf-stage { position: relative; }
    #wf-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
    #wf-lines path.wf-edge { fill: none; stroke: #33404d; stroke-width: 2; }
    #wf-lines path.wf-edge.wf-yes { stroke: rgba(126,231,135,.55); }
    #wf-lines path.wf-edge.wf-no { stroke: rgba(255,166,87,.55); }
    #wf-lines path.wf-edge.wf-both { stroke: rgba(34,211,238,.85); stroke-dasharray: 5 4; }
    #wf-lines text.wf-edge-label { font: 9.5px var(--mono); letter-spacing: .08em; fill: #8b949e; }
    #wf-lines text.wf-edge-label.wf-yes { fill: #7ee787; }
    #wf-lines text.wf-edge-label.wf-no { fill: #ffa657; }
    #wf-lines text.wf-edge-label.wf-both { fill: #67e8f9; }

    .wf-pipeline { position: relative; z-index: 2; display: flex; align-items: stretch; gap: 30px; }
    .wf-stagecol { display: flex; flex-direction: column; justify-content: center; }
    .wf-col-trigger { flex: 0.95 1 0; }
    .wf-col-intake { flex: 1.15 1 0; }
    .wf-col-decision { flex: 0.82 1 0; }
    .wf-col-exec { flex: 1.75 1 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
    .wf-col-report { flex: 1.1 1 0; }
    .wf-col-output { flex: 0.9 1 0; }

     .wf-description-panel{margin-top:20px;padding:24px 28px;background:linear-gradient(135deg,rgba(8,168,191,.12),rgba(88,166,255,.08));border:1px solid rgba(88,166,255,.25);border-left:5px solid #58a6ff;border-radius:12px;backdrop-filter:blur(4px);
}

    .wf-card { position: relative; background: #0f151d; border: 1px solid #26303b; border-top: 3px solid var(--wf-accent, #58a6ff); border-radius: 8px; padding: 14px 15px; transition: opacity .55s ease, transform .55s ease, border-color .3s; }
    .wf-js .wf-card { opacity: 0; transform: translateY(16px); }
    .wf-js .wf-card.wf-in { opacity: 1; transform: none; }
    .wf-card:hover { border-color: var(--wf-accent, #3b5867); }
    .wf-card .wf-kicker { display: block; margin-bottom: 8px; color: var(--wf-accent, #58a6ff); font: 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .wf-card h3 { margin: 0; font: 680 15px/1.15 var(--display); }
    .wf-card .wf-skill { display: block; margin-top: 3px; color: var(--wf-accent, #58a6ff); font: 9.5px var(--mono); }
    .wf-col-trigger .wf-card { --wf-accent: #58a6ff; }
    .wf-col-intake .wf-card { --wf-accent: #d2a8ff; }
    .wf-col-report .wf-card { --wf-accent: #58a6ff; }
    .wf-col-output .wf-card { --wf-accent: #7ee787; }

    .wf-list { list-style: none; margin: 11px 0 0; padding: 0; display: grid; gap: 6px; }
    .wf-list li { position: relative; padding-left: 15px; color: #b7c6cd; font-size: 11.5px; line-height: 1.35; }
    .wf-list li::before { content: ""; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--wf-accent, #58a6ff); }
    .wf-list li b { color: #dbe6ea; font-weight: 600; }
    .wf-note { margin-top: 11px; padding: 7px 9px; border-radius: 5px; font: 9px/1.35 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
    .wf-note.gate { color: #ffe0a8; background: rgba(184,102,0,.16); border: 1px solid rgba(255,204,128,.3); }
    .wf-note.human { color: #a6e6cc; background: rgba(12,163,118,.15); border: 1px solid rgba(79,193,157,.3); }

    .wf-trigger-rows { display: grid; gap: 8px; margin-top: 11px; }
    .wf-runtime { display: flex; align-items: center; gap: 9px; padding: 8px 10px; background: #0c1219; border: 1px solid #262f39; border-radius: 5px; }
    .wf-runtime b { display: block; color: #e6edf3; font: 680 11.5px/1.2 var(--display); }
    .wf-runtime span { color: #8b949e; font: 9px var(--mono); }

    .wf-track { --wf-accent: #7ee787; }
    .wf-track.wf-fx { --wf-accent: #ffa657; }
    .wf-track .wf-caption { margin: 10px 0 0; color: #9fb2bb; font: 9px var(--mono); letter-spacing: .04em; }
    .wf-scan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .wf-scan { display: flex; align-items: center; gap: 9px; padding: 7px 9px; background: #0c1219; border: 1px solid #262f39; border-radius: 5px; }
    .wf-scan b { display: block; color: #e6edf3; font: 680 11px/1.2 var(--display); }
    .wf-scan span { color: #8b949e; font: 9px var(--mono); }
    .wf-logo { flex: 0 0 auto; width: 20px; height: 20px; display: block; }
    .wf-brands { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
    .wf-brands .wf-logo { width: 22px; height: 22px; }

    .wf-decision-card { --wf-accent: #f2cc60; }
    .wf-modes { display: grid; gap: 7px; margin-top: 11px; }
    .wf-mode { display: flex; align-items: baseline; gap: 8px; color: #cdd8dd; font-size: 11.5px; }
    .wf-mode i { flex: 0 0 auto; width: 34px; color: #f2cc60; font: 9px/1.4 var(--mono); font-style: normal; }

    .wf-artifacts { display: grid; gap: 8px; margin-top: 11px; }
    .wf-artifact { padding: 8px 10px; background: #0c1219; border: 1px solid #262f39; border-radius: 5px; }
    .wf-artifact b { display: block; color: #e6edf3; font: 680 10.5px/1.25 var(--mono); }
    .wf-artifact span { color: #8b949e; font-size: 10px; }

    .wf-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; margin: 20px 0 0; color: #9fb2bb; font-size: 11px; }
    .wf-legend span { display: inline-flex; align-items: center; gap: 7px; }
    .wf-legend i { width: 18px; height: 3px; border-radius: 2px; }
    .wf-lg-up { background: #7ee787; }
    .wf-lg-fx { background: #ffa657; }
    .wf-lg-both { background: repeating-linear-gradient(90deg, #22d3ee 0 5px, transparent 5px 9px); }
    .wf-lg-flow { background: #58a6ff; }
.wf-main-title{font: 700 clamp(2.6rem, 4vw, 4rem)/1.1 var(--display);color:#ffffff;margin:0 0 18px;max-width:none;letter-spacing:.02em;
}

    .wf-footer { margin: 18px 0 0; color: #67818d; font: var(--text-meta)/1 var(--mono); letter-spacing: .06em; text-align: center; }

    @media (max-width: 1024px) {
      .wf-pipeline { flex-direction: column; gap: 14px; }
      .wf-col-exec { gap: 14px; }
      #wf-lines { display: none; }
    }

    @media (max-width: 760px) {
      .wrap { width: min(1420px, calc(100% - 28px)); }
    }

    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      .workflow { padding: 12mm 0; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      #wf-lines { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
      .wf-js .wf-card { opacity: 1 !important; transform: none !important; }
    }
  </style>
  <style>
  /* Deck heading - match AI Code Review Agent */
  .wf-eyebrow{ font-family:"Aptos","Segoe UI",Tahoma,sans-serif !important; font-weight:900 !important; font-size:clamp(2rem,3.8vw,2.7rem) !important; line-height:1.1 !important; letter-spacing:-.01em !important; text-transform:none !important; text-shadow:none !important; animation:none !important; background:linear-gradient(120deg,#58a6ff,#d2a8ff,#7ee787) !important; -webkit-background-clip:text !important; background-clip:text !important; -webkit-text-fill-color:transparent !important; color:transparent !important; opacity:1 !important; display:block !important; text-align:center !important; }
  .wf-eyebrow::before{ display:none !important; }
  </style>
</head>
<body>
  <main>
    <section class="workflow" id="workflow" aria-labelledby="workflow-title">
      <div class="wrap">
        <div class="wf-head">
<p class="wf-eyebrow">FOODS - DevSecOps Orchestrator Agent</p>
</div>
<div class="wf-description-panel">
<p class="wf-lede">
<strong>DevSecOps Orchestrator Agent:</strong> It is a custom agent that helps engineers modernize applications,
fix code quality issues, and leverage MCPs to address security vulnerabilities.
</p>
<p class="wf-lede">
<strong>8 Skills:</strong> Effective Skill Identifier, Java, Spring Boot,
Snyk MCP, SemGrep MCP, Sonar MCP, Prisma MCP, Comprehensive Reporting.
</p><p class="wf-lede">
<strong>Human-in-loop:</strong> For all breaking changes and key decisions.
</p>
</div>
<div>
<br>
<br>
</div>
<div class="wf-header-separator"></div>
        <div id="wf-stage">
          <svg id="wf-lines" aria-hidden="true"></svg>

          <div class="wf-pipeline">
            <div class="wf-stagecol wf-col-trigger">
              <div class="wf-card" id="wf-trigger">
                <span class="wf-kicker">01 / Trigger</span>
                <h3>Run the agent</h3>
                <div class="wf-trigger-rows">
                  <div class="wf-runtime"><svg class="wf-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#29B6F6" d="M18.7 2.5 9.9 10.9 5.5 7.6 3.8 8.7l4.1 3.3-4.1 3.3 1.7 1.1 4.4-3.3 8.8 8.4L22 20.4V3.6zM17 8.1v7.8L12.2 12z"/></svg><div><b>VS Code</b><span>local &middot; Podman</span></div></div>
                  <div class="wf-runtime"><svg class="wf-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2A10 10 0 0 0 8.8 21.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.5 2.4 1.1 3 .8 .1-.7.3-1.1.6-1.4-2.2-.2-4.6-1.1-4.6-4.9 0-1.1.4-2 1-2.7-.1-.3-.4-1.3.1-2.8 0 0 .8-.2 2.7 1a9.4 9.4 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .5 1.5.2 2.5.1 2.8.6.7 1 1.6 1 2.7 0 3.8-2.3 4.7-4.6 4.9.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg><div><b>GitHub agent</b><span>cloud &middot; Docker</span></div></div>
                </div>
                <ul class="wf-list"><li><b>DevSecOps Orchestrator</b> agent profile</li></ul>
              </div>
            </div>

            <div class="wf-stagecol wf-col-intake">
              <div class="wf-card" id="wf-intake">
                <span class="wf-kicker">02 / Interactive intake</span>
                <h3>Confirm scope</h3>
                <span class="wf-skill">interactive-intake</span>
                <ul class="wf-list">
                  <li>Mode &middot; target versions</li>
                  <li>Scanners &middot; severities</li>
                  <li>Credentials + MCP readiness</li>
                  <li>Live project + finding counts</li>
                </ul>
                <div class="wf-note human">Human confirms before any change</div>
              </div>
            </div>

            <div class="wf-stagecol wf-col-decision">
              <div class="wf-card wf-decision-card" id="wf-decision">
                <span class="wf-kicker">03 / Decision</span>
                <h3>Mode</h3>
                <div class="wf-modes">
                  <div class="wf-mode"><i>UP</i>Upgrade only</div>
                  <div class="wf-mode"><i>FIX</i>Fix only</div>
                  <div class="wf-mode"><i>BOTH</i>Upgrade first, then fix</div>
                </div>
              </div>
            </div>

            <div class="wf-col-exec">
              <div class="wf-card wf-track wf-up" id="wf-upgrade">
                <span class="wf-kicker">04 / Upgrade track</span>
                <h3>Java + Spring Boot</h3>
                <div class="wf-brands">
                  <svg class="wf-logo" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#E76F00" stroke-width="1.5" stroke-linecap="round"><path d="M10 3.2c-1 .9.5 1.9.5 2.9S9 8.7 10.5 9.7"/><path d="M13 3.4c-.8.8.4 1.6.4 2.4S12 8.2 13.2 9"/></g><path fill="#5382A1" d="M6.6 11h9.8v3.1a2.7 2.7 0 0 1-2.7 2.7H9.3a2.7 2.7 0 0 1-2.7-2.7Z"/><path fill="#5382A1" d="M16.4 11.2a1.8 1.8 0 0 1 .1 3.5v-1a.8.8 0 0 0 0-1.5Z"/><rect x="6.6" y="18.2" width="9.8" height="1.5" rx=".7" fill="#E76F00"/></svg>
                  <svg class="wf-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="#6DB33F" d="M20.6 3.6c-.3 4.5-3.5 6.7-7.4 8-3.5 1.2-4.9 2.8-5.3 4.7 0 0 1.8-1.5 4.6-1.3 4.1.3 8-2.8 8.1-7.9 0 0-.6 1.8-2.5 3 1.3-1.6 2.2-3.9 2.5-6.5Z"/><path fill="#6DB33F" opacity=".5" d="M4.2 17.3A8 8 0 1 1 18 12.5a9.4 9.4 0 0 1-1.5 1A6.4 6.4 0 1 0 6.1 18.3Z"/></svg>
                </div>
                <ul class="wf-list">
                  <li><b>java-springboot-upgrade</b> &middot; staged hops, build + test gate</li>
                  <li><b>junit4-to-junit5-migration</b> &middot; when Boot 4 drops Vintage</li>
                </ul>
                <p class="wf-caption">never downgrade &middot; versions verified in Maven Central</p>
              </div>
              <div class="wf-card wf-track wf-fx" id="wf-fix">
                <span class="wf-kicker">04 / Fix track</span>
                <h3>Scan &rarr; fix &rarr; rebuild &rarr; re-scan</h3>
                <div class="wf-scan-grid">
                  <div class="wf-scan"><svg class="wf-logo" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#ffa657" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.5 20 7.5 12 11.5 4 7.5Z"/><path d="M4 7.5v9l8 4 8-4v-9"/><path d="M12 11.5v9"/></g></svg><div><b>Container scan</b><span>image CVEs &middot; Podman</span></div></div>
                  <div class="wf-scan"><svg class="wf-logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#4C258F"/><path fill="#fff" d="M12 5.6c1 1.7 2 2.5 3.3 3.2v3.5c0 3-3.3 4.5-3.3 4.5s-3.3-1.5-3.3-4.5V8.8C10 8.1 11 7.3 12 5.6Z"/></svg><div><b>Snyk</b><span>MCP &middot; SCA / SAST</span></div></div>
                  <div class="wf-scan"><svg class="wf-logo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#12A150"/><g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 7c-1.8 0-1.8 1.5-1.8 2.5S8.4 12 7.2 12c1.2 0 1.2 1.5 1.2 2.5S8.4 17 10.2 17"/><path d="M13.8 7c1.8 0 1.8 1.5 1.8 2.5S15.6 12 16.8 12c-1.2 0-1.2 1.5-1.2 2.5S15.6 17 13.8 17"/></g></svg><div><b>Semgrep</b><span>MCP &middot; SAST</span></div></div>
                  <div class="wf-scan"><svg class="wf-logo" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke-width="2" stroke-linecap="round"><path d="M4.5 16a11 11 0 0 1 5-4.4" stroke="#1E9BD7"/><path d="M4.5 12.6A15 15 0 0 1 13 7" stroke="#1E9BD7"/><path d="M4.5 9.2A18 18 0 0 1 17 6" stroke="#FF7A00"/></g></svg><div><b>SonarCloud</b><span>MCP &middot; issues + hotspots</span></div></div>
                </div>
                <p class="wf-caption">bounded by the chosen severities</p>
              </div>
            </div>

            <div class="wf-stagecol wf-col-report">
              <div class="wf-card" id="wf-report">
                <span class="wf-kicker">05 / Reporting</span>
                <h3>Checkpointed evidence</h3>
                <span class="wf-skill">reporting</span>
                <div class="wf-artifacts">
                  <div class="wf-artifact"><b>DEVSECOPS-REPORT.md</b><span>engineer + security</span></div>
                  <div class="wf-artifact"><b>PR-SUMMARY.md</b><span>code reviewer</span></div>
                </div>
              </div>
            </div>

            <div class="wf-stagecol wf-col-output">
              <div class="wf-card" id="wf-output">
                <span class="wf-kicker">06 / Output</span>
                <h3>Reviewed change</h3>
                <ul class="wf-list">
                  <li>IDE &middot; local review, no push</li>
                  <li>Cloud &middot; PR opened by GitHub</li>
                </ul>

          <span><i class="wf-lg-both" aria-hidden="true"></i>Both: upgrade &rarr; fix</span>

  <script>
    (function () {
      var stage = document.getElementById('wf-stage');
      var svg = document.getElementById('wf-lines');
      if (!stage || !svg) return;
      document.documentElement.classList.add('wf-js');

      var SVGNS = 'http://www.w3.org/2000/svg';
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var edges = [
        ['wf-trigger', 'wf-intake', null, 'h'],
        ['wf-intake', 'wf-decision', null, 'h'],
        ['wf-decision', 'wf-upgrade', 'yes', 'h'],
        ['wf-decision', 'wf-fix', 'no', 'h'],
        ['wf-upgrade', 'wf-fix', 'both', 'v'],
        ['wf-upgrade', 'wf-report', null, 'h'],
        ['wf-fix', 'wf-report', null, 'h'],
        ['wf-report', 'wf-output', null, 'h']
      ];

      var kindColor = { yes: '#7ee787', no: '#ffa657', both: '#22d3ee' };

      function point(el, side) {
        var r = el.getBoundingClientRect();
        var s = stage.getBoundingClientRect();
        var cx = r.left - s.left + r.width / 2;
        var cy = r.top - s.top + r.height / 2;
        if (side === 'top') return { x: cx, y: r.top - s.top };
        if (side === 'bottom') return { x: cx, y: r.top - s.top + r.height };
        if (side === 'left') return { x: r.left - s.left, y: cy };
        return { x: r.right - s.left, y: cy };
      }

      function build() {
        while (svg.firstChild) svg.firstChild.remove();
        svg.setAttribute('width', stage.clientWidth);
        svg.setAttribute('height', stage.clientHeight);

        edges.forEach(function (edge, index) {
          var from = document.getElementById(edge[0]);
          var to = document.getElementById(edge[1]);
          var kind = edge[2];
          var dir = edge[3] || 'h';
          var labelText = edge[4] || '';
          if (!from || !to) return;

          var p1, p2, d;
          if (dir === 'h') {
            p1 = point(from, 'right');
            p2 = point(to, 'left');
            var midX = (p1.x + p2.x) / 2;
            d = 'M ' + p1.x + ' ' + p1.y + ' C ' + midX + ' ' + p1.y + ', ' + midX + ' ' + p2.y + ', ' + p2.x + ' ' + p2.y;
          } else {
            p1 = point(from, 'bottom');
            p2 = point(to, 'top');
            var midY = (p1.y + p2.y) / 2;
            d = 'M ' + p1.x + ' ' + p1.y + ' C ' + p1.x + ' ' + midY + ', ' + p2.x + ' ' + midY + ', ' + p2.x + ' ' + p2.y;
          }

          var path = document.createElementNS(SVGNS, 'path');
          path.setAttribute('d', d);
          path.setAttribute('class', 'wf-edge' + (kind ? ' wf-' + kind : ''));
          svg.appendChild(path);

          if (labelText) {
            var label = document.createElementNS(SVGNS, 'text');
            label.setAttribute('class', 'wf-edge-label' + (kind ? ' wf-' + kind : ''));
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('x', (p1.x + p2.x) / 2);
            label.setAttribute('y', ((p1.y + p2.y) / 2) + 3);
            label.textContent = labelText;
            svg.appendChild(label);
          }

          if (!reduceMotion) {
            var dot = document.createElementNS(SVGNS, 'circle');
            dot.setAttribute('r', 3.2);
            dot.setAttribute('fill', kindColor[kind] || '#58a6ff');
            dot.setAttribute('opacity', '0.9');
            var motion = document.createElementNS(SVGNS, 'animateMotion');
            motion.setAttribute('dur', '2.6s');
            motion.setAttribute('begin', (index * 0.2) + 's');
            motion.setAttribute('repeatCount', 'indefinite');
            motion.setAttribute('path', d);
            dot.appendChild(motion);
            svg.appendChild(dot);
          }
        });
      }

      var targets = stage.querySelectorAll('.wf-card');
      function revealAll() { targets.forEach(function (el) { el.classList.add('wf-in'); }); }

      if (reduceMotion || !('IntersectionObserver' in window)) {
        revealAll();
      } else {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry, i) {
            if (!entry.isIntersecting) return;
            setTimeout(function () { entry.target.classList.add('wf-in'); }, i * 35);
            io.unobserve(entry.target);
          });
        }, { threshold: 0.1 });
        targets.forEach(function (el) { io.observe(el); });
        window.addEventListener('load', function () { setTimeout(revealAll, 1600); });
      }

      window.addEventListener('load', build);
      window.addEventListener('resize', build);
      stage.addEventListener('transitionend', build);
      build();
    })();
  <\/script>

  <!-- Demo Navigation -->

    .demo-nav { position: fixed; bottom: 1.2rem; right: 1.5rem; display: flex; gap: 0.5rem; z-index: 9999; }
    .demo-nav a { display: inline-flex; align-items: center; justify-content: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; font-size: 1.1rem; text-decoration: none; transition: background 0.2s, transform 0.1s; }

              mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
      animation: spin 10s linear infinite; opacity: .85;
    }

    .flowcap {

    .flowcap.a { left: 74%; top: 50%; color: var(--green); border: 1px solid rgba(102,187,106,.3); }

    /* ── IPO RIBBON ─────────────────────────────────────────────────────── */
    .ipo {
      margin: 18px 0 0; display: flex; align-items: center; justify-content: center;
      gap: 12px; flex-wrap: wrap;
      color: #7a96a2; font: 700 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase;

    @keyframes nudge { 0%,100%{transform:translateX(0)} 50%{transform:translateX(5px)} }

    /* ── MODULE SUMMARY ROW ─────────────────────────────────────────────── */
    .modules {

    .mcard {

    }
    .mcard-head {
      padding: 11px 14px 9px;

    }
    .mcard-icon { font-size: 1.5rem; line-height: 1; }

      font-size: 10.5px; color: #c0d2dc; line-height: 1.35;
      padding-left: 12px; position: relative;
    }
    .mcard-body li::before {
      content: "▸"; position: absolute; left: 0;
      font-size: 9px; top: 1px;
    }

    .mcard.m1 { border-top: 3px solid var(--blue);   }  .mcard.m1 .mcard-num { border: 1px solid var(--blue);   color: var(--blue);   } .mcard.m1 .mcard-title { color: var(--blue);   } .mcard.m1 .mcard-body li::before { color: var(--blue); }
    .mcard.m2 { border-top: 3px solid var(--green);  }  .mcard.m2 .mcard-num { border: 1px solid var(--green);  color: var(--green);  } .mcard.m2 .mcard-title { color: var(--green);  } .mcard.m2 .mcard-body li::before { color: var(--green); }
    .mcard.m3 { border-top: 3px solid var(--purple); }  .mcard.m3 .mcard-num { border: 1px solid var(--purple); color: var(--purple); } .mcard.m3 .mcard-title { color: var(--purple); } .mcard.m3 .mcard-body li::before { color: var(--purple); }
    .mcard.m4 { border-top: 3px solid var(--gold);   }  .mcard.m4 .mcard-num { border: 1px solid var(--gold);   color: var(--gold);   } .mcard.m4 .mcard-title { color: var(--gold);   } .mcard.m4 .mcard-body li::before { color: var(--gold); }

    /* ── IMPROVEMENTS ───────────────────────────────────────────────────── */
    .improve { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .icol {
      border: 1px solid #1f2e3e; border-radius: 14px;

    .chip {
      font: 600 11.5px var(--body); padding: 5px 12px; border-radius: 20px;

    .icol.eng .chip { border-color: rgba(79,195,247,.32); }
    .icol.eff .chip { border-color: rgba(102,187,106,.32); }
    .chip:hover { transform: translateY(-2px); }

    footer {
      margin: 24px 0 0; text-align: center; color: #4e6472;
      font: 10.5px var(--mono); letter-spacing: .06em;
    }

    /* ── RESPONSIVE ─────────────────────────────────────────────────────── */
    @media (max-width: 960px) {
      .stage  { aspect-ratio: auto; height: auto; display: block; min-height: 360px; }
      #links, .flowcap { display: none; }

      .modules { grid-template-columns: 1fr; }

    }

<script>
(function () {
  var stage = document.getElementById('stage');
  var svg   = document.getElementById('links');
  if (!stage || !svg) return;

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS = 'http://www.w3.org/2000/svg';

  // [fromId, toId, stroke-color]
  // Flow: input → core → each module → output
  var links = [
    ['c-in',       'core',        '#22d3ee'],
    ['core',       'n-custom',    '#4fc3f7'],
    ['core',       'n-realistic', '#66bb6a'],
    ['core',       'n-domd',      '#ce93d8'],
    ['core',       'n-gold',      '#f5c518'],
    ['n-custom',   'c-out',       '#4fc3f7'],
    ['n-realistic','c-out',       '#66bb6a'],
    ['n-domd',     'c-out',       '#ce93d8'],
    ['n-gold',     'c-out',       '#f5c518'],
  ];

  function ctr(el) {
    var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
    return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2, w: r.width, h: r.height };
  }
  function edge(el, tx, ty) {
    var c = ctr(el), dx = tx - c.x, dy = ty - c.y;
    if (!dx && !dy) return c;
    var hw = c.w / 2, hh = c.h / 2;
    var t  = Math.min(hw / (Math.abs(dx) || 1e-9), hh / (Math.abs(dy) || 1e-9));
    return { x: c.x + dx * t, y: c.y + dy * t };
  }

  function draw() {
    while (svg.firstChild) svg.firstChild.remove();
    svg.setAttribute('width',  stage.clientWidth);
    svg.setAttribute('height', stage.clientHeight);

    links.forEach(function (lk, idx) {
      var a = document.getElementById(lk[0]);
      var b = document.getElementById(lk[1]);
      if (!a || !b) return;

      var ca = ctr(a), cb = ctr(b);
      var p1 = edge(a, cb.x, cb.y);
      var p2 = edge(b, ca.x, ca.y);

      // gentle quadratic curve bow
      var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      var dx = p2.x - p1.x,       dy = p2.y - p1.y;
      var len = Math.sqrt(dx*dx + dy*dy) || 1;
      var bow = Math.min(42, len * 0.11);
      var cx  = mx + (-dy / len) * bow;
      var cy  = my + ( dx / len) * bow;
      var d   = 'M ' + p1.x + ' ' + p1.y + ' Q ' + cx + ' ' + cy + ' ' + p2.x + ' ' + p2.y;

      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', 'link');
      path.setAttribute('stroke', lk[2]);
      svg.appendChild(path);

      if (!reduced) {
        for (var k = 0; k < 2; k++) {
          var dot = document.createElementNS(NS, 'circle');
          dot.setAttribute('r',       k === 0 ? 3.5 : 2.2);
          dot.setAttribute('fill',    lk[2]);
          dot.setAttribute('opacity', k === 0 ? '1' : '0.55');
          var m = document.createElementNS(NS, 'animateMotion');
          m.setAttribute('dur',         (2.6 + idx * 0.14) + 's');
          m.setAttribute('begin',       (idx * 0.22 + k * 1.15) + 's');
          m.setAttribute('repeatCount', 'indefinite');
          m.setAttribute('path',        d);
          m.setAttribute('keyPoints',   '0;1');
          m.setAttribute('keyTimes',    '0;1');
          m.setAttribute('calcMode',    'linear');
          dot.appendChild(m);
          svg.appendChild(dot);
        }
      }
    });
  }

  window.addEventListener('load',   draw);
  window.addEventListener('resize', draw);
  setTimeout(draw,  60);
  setTimeout(draw, 420);
  draw();
})();
<\/script>

        links.forEach(function (lk, i) {
          var a = document.getElementById(lk[0]);
          var b = document.getElementById(lk[1]);
          var color = lk[2];
          if (!a || !b) return;
          var ca = center(a), cb = center(b);
          var p1 = border(a, cb.x, cb.y);
          var p2 = border(b, ca.x, ca.y);
          // gentle curve: bow perpendicular to the segment
          var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
          var dx = p2.x - p1.x, dy = p2.y - p1.y;
          var len = Math.sqrt(dx * dx + dy * dy) || 1;
          var bow = Math.min(46, len * 0.12);
          var cx = mx + (-dy / len) * bow, cy = my + (dx / len) * bow;
          var d = 'M ' + p1.x + ' ' + p1.y + ' Q ' + cx + ' ' + cy + ' ' + p2.x + ' ' + p2.y;

          var path = document.createElementNS(SVGNS, 'path');
          path.setAttribute('d', d);
          path.setAttribute('class', 'link');
          path.setAttribute('stroke', color);
          svg.appendChild(path);

            for (var k = 0; k < 2; k++) {
              var dot = document.createElementNS(SVGNS, 'circle');

              dot.setAttribute('fill', color);

              m.setAttribute('begin', (i * 0.18 + k * 1.1) + 's');
              m.setAttribute('repeatCount', 'indefinite');
              m.setAttribute('path', d);
              m.setAttribute('keyPoints', '0;1');
              m.setAttribute('keyTimes', '0;1');
              m.setAttribute('calcMode', 'linear');
              dot.appendChild(m);
              svg.appendChild(dot);
            }
          }
        });
      }

      window.addEventListener('resize', build);

function point(el,side){
const r=el.getBoundingClientRect();
const s=stage.getBoundingClientRect();

const cx=r.left-s.left+r.width/2;
const cy=r.top-s.top+r.height/2;

if(side==="left") return {x:r.left-s.left,y:cy};
if(side==="right") return {x:r.right-s.left,y:cy};
if(side==="top") return {x:cx,y:r.top-s.top};

return {x:cx,y:r.bottom-s.top};
}

function build(){

while(svg.firstChild)
svg.removeChild(svg.firstChild);

svg.setAttribute("width",stage.clientWidth);
svg.setAttribute("height",stage.clientHeight);

edges.forEach(edge=>{

const from=document.getElementById(edge[0]);
const to=document.getElementById(edge[1]);

if(!from || !to) return;

const p1=point(from,"right");
const p2=point(to,"left");

const mid=(p1.x+p2.x)/2;

const path=document.createElementNS(
"http://www.w3.org/2000/svg",
"path"
);

const d=
`M ${p1.x} ${p1.y}
 C ${mid} ${p1.y},
   ${mid} ${p2.y},
   ${p2.x} ${p2.y}`;

path.setAttribute("d",d);
path.setAttribute("fill","none");
path.setAttribute("stroke","#2fa07c");
path.setAttribute("stroke-width","2");

svg.appendChild(path);

const dot=document.createElementNS(
"http://www.w3.org/2000/svg",
"circle"
);

dot.setAttribute("r","4");
dot.setAttribute("fill","#2fa07c");

const motion=document.createElementNS(
"http://www.w3.org/2000/svg",
"animateMotion"
);

motion.setAttribute("dur","3s");
motion.setAttribute("repeatCount","indefinite");
motion.setAttribute("path",d);

dot.appendChild(motion);
svg.appendChild(dot);

});

}

window.addEventListener("load",build);
window.addEventListener("resize",build);

})();

<script>
(function(){
  var nodes = document.querySelectorAll('script.slide-src');
  var srcs = [];
  for (var k=0;k<nodes.length;k++){
    srcs.push({
      html: nodes[k].textContent.replace(/<\\\/script>/gi,'<\/script>'),
      title: nodes[k].getAttribute('data-title') || ('Slide '+(k+1))
    });
  }
  var i=0;
  var stage=document.getElementById('stage');
  var bar=document.getElementById('bar');
  var prevBtn=document.getElementById('prev');
  var nextBtn=document.getElementById('next');
  var homeBtn=document.getElementById('home');
  var hint=document.getElementById('hint');

  function render(){
    stage.srcdoc=srcs[i].html;
    bar.style.width=((i+1)/srcs.length*100)+'%';
    prevBtn.disabled=(i===0);
    nextBtn.disabled=(i===srcs.length-1);
    hint.style.display=(i===0)?'block':'none';
  }
  function go(n){ if(n<0||n>=srcs.length) return; i=n; render(); }
  function next(){ if(i<srcs.length-1) go(i+1); }
  function prev(){ if(i>0) go(i-1); }

  nextBtn.onclick=next; prevBtn.onclick=prev; homeBtn.onclick=function(){ go(0); };

  function keyHandler(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); go(0); }
    else if(e.key==='End'){ e.preventDefault(); go(srcs.length-1); }
  }
  window.addEventListener('keydown',keyHandler);

  stage.addEventListener('load',function(){
    try{
      var doc=stage.contentDocument;
      if(!doc) return;
      doc.addEventListener('keydown',keyHandler);
      if(i===0){
        doc.body.style.cursor='pointer';
        doc.addEventListener('click',function(){ next(); },{once:true});
      }
    }catch(err){}
  });

  render();
})();
</script>
